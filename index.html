<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR Counselling</title>
<meta name="description" content="AMR Counselling — a new site is on the way.">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f7f5f1;
    --ink: #2b2b28;
    --muted: #6b6a63;
    --rule: #ded9d0;
    --accent: #4a6b5d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --ink: #ece9e3;
      --muted: #9a978f;
      --rule: #333330;
      --accent: #8fb3a2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--ink);
    font: 400 clamp(1rem, 0.95rem + 0.3vw, 1.0625rem)/1.65 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 32rem; }
  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(1.75rem, 1.4rem + 1.8vw, 2.5rem);
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }
  h1 span { display: block; color: var(--muted); font-size: 0.42em; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.9rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
</style>
</head>
<body>
<main>
  <h1><span>AMR Counselling</span>A new site is on the way.</h1>
  <p>Thank you for visiting. Full details about services and availability will be here shortly.</p>
  <hr>
  <p>In the meantime, please get in touch at<br>
  <a href="mailto:hello@amrcounselling.ca">hello@amrcounselling.ca</a></p>
</main>
</body>
</html>
